<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e38;
      --text: #e7e9ee;
      --muted: #8b93a5;
      --accent: #5b8cff;
      --user-bubble: #5b8cff;
      --ai-bubble: #232733;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .title {
      font-weight: 600;
      font-size: 15px;
    }
    header .session {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #new-chat {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #new-chat:hover { opacity: 0.9; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #tenant-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 4px; }
    .assistant.pending .bubble { color: var(--muted); }
    .assistant.error .bubble { background: #3a1f24; color: #ff9494; }

    #empty-state {
      margin: auto;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    form#composer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    #input {
      flex: 1;
      background: #0f1115;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">Prototype</div>
      <div class="session" id="session-label"></div>
    </div>
    <div class="header-actions">
      <select id="tenant-select" title="Which business's data this session is scoped to">
        <option value="tenant_a">tenant_a</option>
        <option value="tenant_b">tenant_b</option>
      </select>
      <button id="new-chat">New chat</button>
    </div>
  </header>

  <div id="messages">
    <div id="empty-state">Say something to start the conversation.</div>
  </div>

  <form id="composer">
    <input id="input" type="text" autocomplete="off" placeholder="Message..." />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const messagesEl = document.getElementById("messages");
    const emptyStateEl = document.getElementById("empty-state");
    const sessionLabelEl = document.getElementById("session-label");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");
    const tenantSelect = document.getElementById("tenant-select");

    let sessionId = null;

    function newSessionId() {
      return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
    }

    function startNewChat() {
      sessionId = newSessionId();
      sessionLabelEl.textContent = `session: ${sessionId} · tenant: ${tenantSelect.value}`;
      messagesEl.innerHTML = "";
      messagesEl.appendChild(emptyStateEl);
      input.value = "";
      input.focus();
    }

    function addMessage(role, text) {
      if (emptyStateEl.parentNode) emptyStateEl.remove();
      const row = document.createElement("div");
      row.className = `row ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    async function sendMessage(text) {
      addMessage("user", text);
      const pendingRow = addMessage("assistant", "…");
      pendingRow.classList.add("pending");
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, tenant_id: tenantSelect.value, message: text }),
        });
        if (!res.ok) throw new Error(`request failed (${res.status})`);
        const data = await res.json();
        pendingRow.classList.remove("pending");
        pendingRow.querySelector(".bubble").textContent = data.answer;
      } catch (err) {
        pendingRow.classList.remove("pending");
        pendingRow.classList.add("error");
        pendingRow.querySelector(".bubble").textContent = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    newChatBtn.addEventListener("click", startNewChat);
    // Switching tenants mid-conversation would mix two businesses' data
    // under one session, so treat it the same as starting a new chat.
    tenantSelect.addEventListener("change", startNewChat);

    startNewChat();
  </script>
</body>
</html>
